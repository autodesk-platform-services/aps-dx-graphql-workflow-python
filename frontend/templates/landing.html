<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Exchange Workflow Bench</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='img/fdxgraph.svg') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/variables.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/landing.css') }}">
</head>
<body class="landing-page">
    <div class="landing-card">
        <div class="landing-brand">
            <img src="{{ url_for('static', filename='img/fdxgraph.svg') }}" alt="" class="brand-icon">
            Data Exchange Workflow Bench
        </div>

        <!-- Placeholder art: a small node graph in the app's accent colors -->
        <svg class="landing-art" viewBox="0 0 320 160" xmlns="http://www.w3.org/2000/svg">
            <path class="art-primary" d="M40 50 C90 50, 90 30, 140 30" />
            <path class="art-primary" d="M40 50 C90 50, 90 100, 140 100" />
            <path class="art-primary" d="M140 30 C190 30, 190 65, 240 65" />
            <path class="art-primary" d="M140 100 C190 100, 190 65, 240 65" />
            <circle class="art-success" cx="40" cy="50" r="9" />
            <circle class="art-warning" cx="140" cy="30" r="9" />
            <circle class="art-info" cx="140" cy="100" r="9" />
            <circle class="art-tertiary" cx="240" cy="65" r="9" />
        </svg>

        <h1 class="landing-title">Welcome to Data Exchange Workflow Bench</h1>
        <p class="landing-subtitle">
            Design, connect, and run data flows visually.
            Sign in with your Autodesk account to open the editor.
        </p>

        <a href="{{ url_for('auth.login') }}" class="landing-cta">Sign In with Autodesk</a>

        <div class="landing-footnote">Uses your Autodesk Platform Services account</div>
    </div>
</body>
</html>
